plugins {
    id 'java'
}

group = 'com.log10x'
version = "${l1esVersion}.es.${elasticsearchVersion}"

sourceCompatibility = '17'
targetCompatibility = '17'

repositories {
    mavenLocal()
    mavenCentral()
}

processResources {
    filesMatching("**/l1es.properties") {
        expand(project.properties)
    }
}

dependencies {
    compileOnly "org.elasticsearch:elasticsearch:${elasticsearchVersion}"
    compileOnly "org.apache.lucene:lucene-core:${luceneVersion}"
    compileOnly "org.apache.lucene:lucene-queries:${luceneVersion}"
    compileOnly "org.apache.logging.log4j:log4j-api:2.21.1"

    implementation "com.fasterxml.jackson.core:jackson-annotations:${jacksonDataBindVersion}"
    implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonDataBindVersion}"
    implementation "com.log10x:log10x-decoder-core:${log10xDecoderVersion}"
    implementation "it.unimi.dsi:fastutil:8.5.13"
}

// Build plugin zip for ES installation
task pluginZip(type: Zip) {
    archiveBaseName = 'l1es-plugin'
    from jar
    from configurations.runtimeClasspath
    from('src/main/config') {
        into 'config'
    }
    from('src/main/resources/plugin-descriptor.properties')
}

pluginZip.dependsOn jar

// Make build depend on pluginZip
build.dependsOn pluginZip

